# Makes sites using this jar default to the theme layouts
site.theme=quarkiverse

# The theme's web dependencies (fonts, icons) are transitive, so they are runtime-scoped; allow the bundler to use them
quarkus.web-bundler.dependencies.compile-only=false

# The footer's Contribute link: the repository being built in GitHub Actions. Outside CI there is no such variable,
# so it falls back to the theme's home. Sites can set this property themselves.
quarkiverse-website-theme.contribute-url=https://github.com/${GITHUB_REPOSITORY:quarkiverse/quarkiverse.io}
