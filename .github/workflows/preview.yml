name: Surge PR Preview

on:
  workflow_run:
    workflows: [ "Build" ]
    types:
      - completed

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      packages: read
      # this is unfortunately needed to be able to write comments on pull requests
      pull-requests: write
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Download Built site
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: site
          github-token: ${{ secrets.GITHUB_TOKEN }} # token with actions:read permissions on target repo
      - name: Validate and expose PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # workflow_run.pull_requests is empty for pull requests opened from forks:
          # look the pull request up from the branch the build ran on instead.
          if [[ -z "$RAW_PR_NUMBER" ]]; then
            RAW_PR_NUMBER=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=open -f head="${HEAD_OWNER}:${HEAD_BRANCH}" -f per_page=100 \
              --jq '.[0].number // empty')
          fi
          if ! [[ "$RAW_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $RAW_PR_NUMBER" >&2
            exit 1
          fi
          echo "id=$RAW_PR_NUMBER" >> $GITHUB_OUTPUT
      - name: Publishing to surge for preview
        id: deploy
        env:
          PR_ID: ${{ steps.pr.outputs.id }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx surge@0.23.1 ./ --domain "https://quarkiverse-pr-io-${PR_ID}-preview.surge.sh" --token "$SURGE_TOKEN"
      - name: Update PR status comment on success
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            🚀 PR Preview ${{ github.sha }} has been successfully built and deployed to https://quarkiverse-pr-io-${{ steps.pr.outputs.id }}-preview.surge.sh
          body-marker: '<!-- Sticky Pull Request Comment -->'
          pr-number: ${{ steps.pr.outputs.id }}
      - name: Update PR status comment on failure
        uses: quarkusio/action-helpers@main
        if: ${{ failure() }}
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            😭 Deploy PR Preview failed.
          body-marker: '<!-- Sticky Pull Request Comment -->'
          pr-number: ${{ steps.pr.outputs.id }}
